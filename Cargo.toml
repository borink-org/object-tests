[package]
name = "object-tests"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A data-driven object storage conformance grader"
include = ["src/**", "cases/**", "tests/**", "README.md", "Cargo.toml"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex-lite = "0.1"
httpdate = "1"
percent-encoding = "2"
roxmltree = "0.20"
httparse = "1.10"

# Cargo builds this native process fixture during tests, not normal builds.
[[example]]
name = "test-adapter"
path = "tests/support/adapter.rs"
