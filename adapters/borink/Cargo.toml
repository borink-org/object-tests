[package]
name = "borink-adapter"
version = "0.0.0"
edition = "2024"
publish = false

# Kept out of the grader's workspace: an adapter's library is separate from
# the Rust dependency graph of the suite.
[workspace]

[dependencies]
# The adapter itself lives in borink-org/object-storage, beside the crates whose
# API it calls. This is the commit whose adapter speaks this revision's protocol.
borink-object-tests-adapter = { git = "https://github.com/borink-org/object-storage.git", rev = "03829e1253bccf62ae55d09b607731a5c4b74952" }

[features]
# HTTPS, which only the live probes need. Offline grading uses plain HTTP on loopback.
live = ["borink-object-tests-adapter/live"]
